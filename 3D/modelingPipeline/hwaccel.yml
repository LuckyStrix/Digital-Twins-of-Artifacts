# GPU reservation, pulled into docker-compose.yml with `extends:`. Every NVIDIA
# GPU on the host is passed through. COLMAP uses all of them unless the app's
# "GPU index" setting (or CUDA_VISIBLE_DEVICES) picks one.
services:
  cuda:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
