<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Spectral Band Viewer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="msi-body">

  <a id="backLink" class="pill-button" href="index.html">&larr; Back to gallery</a>
  <div id="status" class="pill-button status-pill">Loading bands…</div>

  <div id="mishaCredit" class="misha-credit-banner">
    Multispectral capture by
    <a href="https://www.rit.edu/chipr/misha" target="_blank" rel="noopener noreferrer">MISHA</a>
    — an independent imaging project at RIT's Cultural Heritage Imaging,
    Preservation, and Research program, not one of this site's own capture systems.
  </div>

  <div id="infoPanelWrapper">
    <button id="infoToggle" class="pill-button">Artifact Info &#x25BC;</button>
    <div id="infoPanel">
      <h2 id="infoName"></h2>
      <span id="infoType" class="type-badge"></span>
      <p id="infoDescription"></p>
      <a id="infoLink" class="info-link" href="#" target="_blank" rel="noopener noreferrer"></a>
      <a id="crossLink" class="info-link" href="#"></a>
    </div>
  </div>

  <div id="msiStage">
    <canvas id="msiCanvas"></canvas>
  </div>

  <div id="msiControls">
    <div id="recipeRow" class="recipe-row"></div>

    <div class="msi-panel-body">
      <div id="eqRow" class="eq-row"></div>

      <div class="global-controls">
        <label class="slider-row">
          <div class="slider-row-header">
            <span>Exposure</span>
            <output id="exposureValue">1.00&times;</output>
          </div>
          <input type="range" id="exposureSlider" min="0.25" max="4" step="0.05" value="1" />
        </label>
        <label class="slider-row">
          <div class="slider-row-header">
            <span>Contrast</span>
            <output id="contrastValue">1.00&times;</output>
          </div>
          <input type="range" id="contrastSlider" min="0.5" max="2.5" step="0.05" value="1" />
        </label>
        <button id="resetButton" class="panel-button">Reset</button>
      </div>
    </div>

    <p id="recipeCaption" class="recipe-caption"></p>
  </div>

  <script type="module" src="js/msi.js"></script>
</body>
</html>
